services:
  movieflix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movieflix-app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=production
      - PORT=9000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=/app/data/database.sqlite
      # Optional: set your TMDB API Key here or in .env.local
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production-64chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super-secret-refresh-jwt-key-change-in-production}
    volumes:
      # Persistent SQLite DB, thumbnails, and cache
      - ./data:/app/data
      # Mount your local movie/series storage folders below (read-only):
      - ./media/movies:/media/movies:ro
      - ./media/series:/media/series:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
