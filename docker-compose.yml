version: '3.8'

services:
  app:
    build: .
    ports:
      - "9000:9000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_PATH=./data/database.sqlite
      - FFMPEG_PATH=ffmpeg
      - MEDIA_MOVIES_PATH=/media/movies
      - MEDIA_SERIES_PATH=/media/series
      - TRANSCODE_TEMP_DIR=./data/transcode-temp
      - MAX_CONCURRENT_SESSIONS=3
      - SESSION_TIMEOUT_MINUTES=30
    volumes:
      - ./data:/app/data
      - /media/movies:/media/movies
      - /media/series:/media/series
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: